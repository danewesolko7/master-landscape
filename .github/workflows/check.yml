# Build the site and run the launch checks (tools/check.mjs).
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check -- --json
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: test-results/check.json
