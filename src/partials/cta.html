<section aria-labelledby="cta-title" class="cta">
  <div class="cta__inner">
    <div class="cta__body">
      <h2 id="cta-title" class="heading">{{heading}}</h2>
      <p class="cta__text">{{text}}</p>
      <div class="actions">
        <a href="Contact.html" class="btn btn--primary btn--on-dark">Request a&nbsp;proposal&nbsp;→</a>
        <a href="Contact.html#rfp" class="btn btn--ghost-light">Submit an&nbsp;RFP</a>
      </div>
      <a href="tel:{{phone_tel}}" class="cta__phone">Or call&nbsp;{{phone}}</a>
    </div>
    <div class="cta__media"><picture><source type="image/avif" srcset="assets/img/palm-turf-hedge.avif"><source type="image/webp" srcset="assets/img/palm-turf-hedge.webp"><img src="assets/img/palm-turf-hedge.jpg" alt="Palm tree in a mulched ring on manicured turf beside a hedge" class="media media--md" width="363" height="270" loading="lazy" decoding="async"></picture></div>
  </div>
</section>
